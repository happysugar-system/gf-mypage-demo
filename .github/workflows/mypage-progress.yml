name: Driver MyPage seven-step regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/mypage-progress.test.mjs'
      - '.github/workflows/mypage-progress.yml'
  workflow_dispatch:
jobs:
  progress-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/mypage-progress.test.mjs
