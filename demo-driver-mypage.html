<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD FIRST｜デモドライバーマイページ</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#172b29;background:#f3f6f5}*{box-sizing:border-box}body{margin:0}header{background:#164b40;color:white;padding:18px 24px;font-weight:700}main{max-width:680px;margin:30px auto;padding:0 16px}.card{background:white;border-radius:16px;padding:24px;margin:16px 0;box-shadow:0 4px 20px #163c2b10}h1{font-size:24px}h2{font-size:18px}label{display:block;font-size:13px;margin-top:14px}input{width:100%;padding:12px;border:1px solid #cbd4d1;border-radius:8px;margin-top:6px}button{background:#0bbf65;color:white;border:0;border-radius:9px;padding:13px 20px;font-weight:700;cursor:pointer;margin-top:16px}button:disabled{background:#aab3b1}.muted{color:#65716f;font-size:13px;line-height:1.6}.item{border-top:1px solid #e3e8e5;padding:12px 0}.value{font-size:18px;font-weight:700}#status{white-space:pre-wrap;color:#9a392f}a{color:#126c56}#logout{background:#53645f} .hidden{display:none}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script></head><body><header>GOLD FIRST | デモドライバーマイページ</header><main><p class="muted">デモ環境です。実際の車両・契約・書類データは表示しません。</p><section id="login" class="card"><h1>マイページにログイン</h1><p class="muted">LINE本人確認とDriverIDの紐づけが完了したデモ用アカウントでログインしてください。</p><form id="form"><label>メールアドレス<input id="email" type="email" autocomplete="username" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" required></label><button id="submit" type="submit">ログイン</button></form><p class="muted">まだ本人確認していない場合は <a href="./demo-mypage-first-registration.html">初回登録へ</a></p></section><p id="status" role="status"></p><section id="mypage" class="hidden"><div class="card"><h1>ドライバーマイページ</h1><p class="muted">認証済みのご本人のデモ情報のみ表示しています。</p><div class="item"><div class="muted">お名前</div><div class="value" id="name"></div></div><div class="item"><div class="muted">DriverID</div><div class="value" id="driver"></div></div><div class="item"><div class="muted">本人紐づけ</div><div class="value">完了</div></div><button id="logout" type="button">ログアウト</button></div><div class="card"><h2>利用車両</h2><p class="muted">デモ用の車両データはまだ登録されていません。実際の車両台帳とは未接続です。</p></div><div class="card"><h2>書類・契約情報</h2><p class="muted">デモ用の書類はまだ登録されていません。実際のDrive書類とは未接続です。</p></div></section></main><script>
'use strict';
const sb=window.supabase.createClient('https://zwprphmfgobkektzsuti.supabase.co',"sb_publishable__wtlccECQwOVd3-LvRVFYQ_2dCUlPVR",{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const status=document.getElementById('status'),login=document.getElementById('login'),page=document.getElementById('mypage'),submit=document.getElementById('submit');
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;status.textContent='認証中…';try{
const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});
if(error||!data.session)throw Error('ログインできませんでした。');
const {data:profile,error:rpcError}=await sb.rpc('gf_demo_get_my_profile');
if(rpcError)throw Error('プロフィールを取得できませんでした。');
if(!profile){await sb.auth.signOut();throw Error('DriverIDの本人紐づけがまだ完了していません。初回登録を行ってください。');}
document.getElementById('name').textContent=profile.display_name||'未登録';
document.getElementById('driver').textContent=profile.driver_id;
login.classList.add('hidden');page.classList.remove('hidden');status.textContent='';
}catch(err){status.textContent=err.message||'認証エラー';await sb.auth.signOut();}finally{submit.disabled=false;}});
document.getElementById('logout').addEventListener('click',async()=>{await sb.auth.signOut();page.classList.add('hidden');login.classList.remove('hidden');document.getElementById('password').value='';status.textContent='ログアウトしました。';});
</script></body></html>
