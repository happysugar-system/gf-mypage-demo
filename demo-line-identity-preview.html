<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOLD FIRST｜マイページ</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f6f8;color:#17212b;margin:0;padding:24px}.panel{max-width:520px;margin:50px auto;background:white;border-radius:18px;padding:28px;box-shadow:0 5px 30px #16263b12}h1{font-size:23px}p{line-height:1.7}button{background:#06c755;color:white;border:0;border-radius:9px;padding:14px 20px;font-weight:700;width:100%;cursor:pointer}button:disabled{background:#a4acb2;cursor:not-allowed}.muted{color:#5d6772;font-size:14px}#status{white-space:pre-wrap}</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script></head>
<body><main class="panel"><h1>GOLD FIRST｜マイページ</h1>

<p id="status" role="status">LINE認証の準備をしています…</p><section id="entry" hidden><p>ご利用のマイページを選択してください。</p><a href="./" style="display:block;text-align:center;padding:14px;background:#06c755;color:white;border-radius:9px;text-decoration:none;font-weight:700;margin:12px 0">ドライバーマイページ</a><a href="./demo-mypage-first-registration.html" style="display:block;text-align:center;color:#176b55;font-weight:600;margin:4px 0 20px;text-decoration:underline">新規の方はこちら</a><a href="https://happysugar-system.github.io/gf-ledger/company-portal/" style="display:block;text-align:center;padding:14px;background:#146a9b;color:white;border-radius:9px;text-decoration:none;font-weight:700">法人担当者マイページ</a><a href="https://happysugar-system.github.io/gf-ledger/company-admin/member-apply.html" style="display:block;text-align:center;color:#146a9b;font-weight:600;margin:4px 0 12px;text-decoration:underline">新規の方はこちら</a></section>
<button id="verify" hidden disabled>LINE本人確認を行う</button>
</main>
<script>
'use strict';
const DEMO_LIFF_ID='2012058414-9wPp65Lt';
// Set only after a separate demo endpoint is deployed and audited. Never point at gf-line-mypage-link.
const DEMO_LINK_ENDPOINT='https://zwprphmfgobkektzsuti.supabase.co/functions/v1/gf-demo-line-mypage-link';
const status=document.getElementById('status'), button=document.getElementById('verify');
let verifiedLiff=false;
async function init(){
 try{
  if(!window.liff)throw Error('LINE SDKを読み込めませんでした');
  await liff.init({liffId:DEMO_LIFF_ID});
  verifiedLiff=liff.isLoggedIn();
  if(!verifiedLiff){status.textContent='LINEログインへ移動します…';liff.login({redirectUri:location.href});return;}
  
  if(!/^https:\/\/[^/]+\.supabase\.co\/functions\/v1\/gf-demo-line-mypage-link$/.test(DEMO_LINK_ENDPOINT)){throw Error('デモ専用接続先が不正です');}
  const searchParams=new URLSearchParams(location.search);
  const liffState=searchParams.get('liff.state')||'';
  const stateParams=new URLSearchParams(liffState.startsWith('?')?liffState.slice(1):liffState);
  const invite=searchParams.get('invite')||stateParams.get('invite');
  if(invite){
   if(!/^[A-Za-z0-9_-]{43}$/.test(invite)){status.textContent='招待リンクの形式が不正です。';return;}
   const target=new URL('./existing-driver-line-invite-demo.html',location.href);
   target.searchParams.set('invite',invite);
   location.replace(target.href);
   return;
  }
  const challenge=searchParams.get('mypage_challenge')||stateParams.get('mypage_challenge');
  if(!challenge){status.textContent='LINEログインを確認しました。';document.getElementById('entry').hidden=false;return;}if(!/^[A-Za-z0-9_-]{43}$/.test(challenge)){status.textContent='認証リンクの形式が不正です。';return;}
  button.hidden=false;button.disabled=false;
  button.onclick=async()=>{
   button.disabled=true;status.textContent='本人確認中です…';
   try{
    const idToken=liff.getIDToken();
    if(!idToken)throw Error('LINE認証情報を取得できません');
    const response=await fetch(DEMO_LINK_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'complete',challenge,line_id_token:idToken})});
    const result=await response.json();
    if(!response.ok||result.linked!==true)throw Error('本人確認を完了できませんでした');
    status.textContent='本人確認が完了しました。';const link=document.createElement('a');link.href='./demo-existing-mypage-integration.html';link.textContent='マイページを開く';link.style.cssText='display:block;margin-top:14px;text-align:center;padding:14px;background:#176b55;color:white;border-radius:9px;font-weight:700;text-decoration:none';status.after(link);
   }catch(e){status.textContent=e.message||'通信エラーが発生しました';button.disabled=false;}
  };
  status.textContent='LINEログインを確認しました。本人確認を開始できます。';
 }catch(e){status.textContent='LINE認証の初期化に失敗しました。LINEから開き直してください。';}
}
init();
</script></body></html>
