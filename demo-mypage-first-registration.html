<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD FIRST｜デモ初回登録</title><style>body{font-family:system-ui,sans-serif;background:#f3f5f7;margin:0;padding:20px;color:#18212c}.card{max-width:480px;margin:50px auto;background:white;padding:28px;border-radius:16px}input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:8px}input{border:1px solid #ccd2da}button{background:#06c755;color:#fff;border:0;font-weight:700}button:disabled{background:#aab0b5}.note{color:#5d6570;font-size:13px;line-height:1.7}#status{white-space:pre-wrap}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script></head><body><main class="card"><h1>GOLD FIRST デモ初回登録</h1><p class="note">テスト用です。本番のドライバー情報は使用しません。デモ用Supabaseに登録した確認済みメールアカウントでログインしてください。</p><form id="login"><input id="email" type="email" autocomplete="email" placeholder="デモ用メールアドレス" required><input id="password" type="password" autocomplete="current-password" placeholder="パスワード" required><button id="go" type="submit">ログインしてLINE本人確認へ</button></form><p id="status" role="status"></p><p class="note">本人確認済みのデモLINE IDとDriverIDの登録がない場合、紐づけは行われません。ログイン情報はGitHubに保存されません。</p></main><script>
'use strict';
const PROJECT='https://zwprphmfgobkektzsuti.supabase.co';
const PUBLIC_KEY="sb_publishable__wtlccECQwOVd3-LvRVFYQ_2dCUlPVR";
const API=PROJECT+'/functions/v1/gf-demo-line-mypage-link';
const NEXT='https://happysugar-system.github.io/gf-mypage-demo/demo-line-identity-preview.html';
const status=document.getElementById('status'),form=document.getElementById('login'),button=document.getElementById('go');
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;status.textContent='ログイン確認中…';try{
 const sb=window.supabase.createClient(PROJECT,PUBLIC_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
 const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});
 if(error||!data.session)throw Error('ログインできません。デモ用アカウントを確認してください。');
 const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+data.session.access_token,'apikey':PUBLIC_KEY},body:JSON.stringify({action:'begin'})});
 const result=await res.json();if(!res.ok||!result.challenge)throw Error('本人確認リンクを作れませんでした。認証設定を確認してください。');
 status.textContent='LINE認証画面へ移動します…';
 location.assign(NEXT+'?mypage_challenge='+encodeURIComponent(result.challenge));
 }catch(err){status.textContent=err.message||'処理に失敗しました';button.disabled=false;}});
</script></body></html>
