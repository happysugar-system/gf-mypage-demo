<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD FIRST｜ドライバー初回登録</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:#1d3030;font:16px system-ui,sans-serif}header{background:#173e36;color:#fff;padding:22px;font-weight:700}main{max-width:530px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:18px;padding:25px;box-shadow:0 3px 16px #0001}h1{font-size:23px;margin:0 0 12px}p{line-height:1.7}.muted{color:#61716e;font-size:14px}.notice{background:#fff4e9;color:#9b4e1f;border-radius:9px;padding:13px}label{display:block;font-weight:650;margin-top:17px}input{display:block;width:100%;padding:14px;margin-top:7px;border:1px solid #c7d3d0;border-radius:10px;font-size:16px}button{width:100%;margin-top:24px;padding:16px;background:#176e57;color:#fff;border:0;border-radius:10px;font-size:16px;font-weight:700}button:disabled{background:#aebbb7}.small{font-size:12px;color:#687774}#status{white-space:pre-wrap}</style><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script></head>
<body><header>GOLD FIRST｜ドライバー初回登録</header><main><div class="card">
<h1>初回登録のご案内</h1><p class="notice">車両依頼がお済みの方が対象です。車両依頼後に登録してください。</p>
<p>既存のドライバー情報を確認し、LINEとマイページを連携します。</p>
<form id="registration">
<label for="name">氏名（必須）</label><input id="name" autocomplete="name" maxlength="80" required placeholder="例：山田 太郎">
<label for="phone">車両依頼時の電話番号（必須）</label><input id="phone" autocomplete="tel" inputmode="tel" maxlength="20" required placeholder="例：09012345678">
<label for="email">メールアドレス（任意・未登録の方は入力）</label><input id="email" type="email" autocomplete="email" maxlength="254" placeholder="例：example@example.com">

<button id="submit" type="submit" disabled>LINE認証を確認中…</button>
</form><p id="status" class="muted" role="status">LINE認証を確認しています…</p>

</div></main><script>
const status=document.getElementById('status'),btn=document.getElementById('submit');
let token='';
async function init(){
 try{
  if(!window.liff)throw Error('LINEの読み込みに失敗しました');
  await liff.init({liffId:'2012058414-9wPp65Lt'});
  if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}
  token=liff.getIDToken();
  if(!token)throw Error('LINE認証情報を取得できません。LINEアプリから開いてください。');
  btn.disabled=false;btn.textContent='初回登録を申請する';status.textContent='LINE認証を確認しました。必要事項を入力してください。';
 }catch(e){status.textContent=e.message||'LINE認証を確認できませんでした。';btn.disabled=true;}
}
document.getElementById('registration').addEventListener('submit',async e=>{
 e.preventDefault();if(!token)return;
 btn.disabled=true;status.textContent='登録申請を送信しています…';
 try{
  const response=await fetch('https://tgxrnrqxafytyqfwwsag.supabase.co/functions/v1/gf-driver-self-registration-staging',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'submit',line_id_token:token,full_name:document.getElementById('name').value,phone_number:document.getElementById('phone').value,email:document.getElementById('email').value})});
  const data=await response.json();if(!response.ok||!data.received)throw Error(data.error||'送信できませんでした');
  status.textContent=data.message||'申請を受け付けました。';btn.textContent='申請受付済み';
 }catch(err){status.textContent=err.message||'通信に失敗しました';btn.disabled=false;}
});
init();
</script></body></html>
