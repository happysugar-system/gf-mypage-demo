<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOLD FIRST｜既存ドライバー招待管理（デモ）</title>
<style>
:root{font-family:system-ui,sans-serif;color:#213b34;background:#f2f5f4}*{box-sizing:border-box}main{max-width:580px;margin:24px auto;padding:22px;background:white;border-radius:16px;box-shadow:0 2px 14px #0001}h1{font-size:22px}h2{font-size:18px;margin-top:28px}label{display:block;margin-top:15px;font-weight:650}input{width:100%;padding:12px;font-size:16px;margin-top:5px;border:1px solid #bacdc7;border-radius:9px}button{background:#176a54;color:white;border:0;border-radius:9px;padding:13px 16px;margin-top:15px;font-size:15px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#e4ece9;color:#245144}.muted{color:#657671;font-size:13px;line-height:1.7}.hidden{display:none}pre{white-space:pre-wrap;word-break:break-all;background:#f4f7f6;padding:12px;border-radius:9px}#result{overflow-wrap:anywhere}a{overflow-wrap:anywhere}
</style></head><body><main>
<h1>GOLD FIRST｜既存ドライバー招待管理</h1>
<p class="muted">開発用デモ。本人と連絡先を確認した既存ドライバーにのみ、一度きりの招待リンクを発行します。リンクを第三者に渡さないでください。</p>
<section id="loginPanel">
<h2>管理者ログイン</h2>
<label>デモSupabase登録メール<input id="email" type="email" autocomplete="email"></label>
<label>パスワード<input id="password" type="password" autocomplete="current-password"></label>
<button id="login">ログイン</button>
</section>
<section id="adminPanel" class="hidden">
<p id="signedIn" class="muted"></p>
<button id="logout" class="secondary">ログアウト</button>
<h2>招待リンクを発行</h2>
<label>既存DriverID<input id="driverId" placeholder="GF-DEMO-0001" maxlength="40" autocomplete="off"></label>
<p class="muted">デモに登録済みのDriverIDのみ対象。管理者権限はサーバー側で検証されます。発行リンクの有効期限は24時間、使用は1回限りです。</p>
<button id="issue">招待リンクを発行する</button>
<div id="result" aria-live="polite"></div>
</section>
<pre id="status" aria-live="polite">認証状態を確認しています…</pre>
</main>
<script>
"use strict";
const BASE="https://zwprphmfgobkektzsuti.supabase.co";
const KEY="sb_publishable__wtlccECQwOVd3-LvRVFYQ_2dCUlPVR";
const FN=BASE+"/functions/v1/gf-demo-existing-driver-invite";
const $=id=>document.getElementById(id);
let accessToken=null;
const status=s=>$("status").textContent=s;
function display(active){
 $("loginPanel").classList.toggle("hidden",active);
 $("adminPanel").classList.toggle("hidden",!active);
}
async function request(url,opts){
 const ctrl=new AbortController();
 const timeout=setTimeout(()=>ctrl.abort(),15000);
 try{return await fetch(url,{...opts,signal:ctrl.signal,cache:"no-store"});}
 finally{clearTimeout(timeout);}
}
$("login").addEventListener("click",async()=>{
 $("login").disabled=true;
 status("ログイン処理中…");
 try{
  const email=$("email").value.trim(),password=$("password").value;
  if(!email||!password)throw Error("メールアドレスとパスワードを入力してください");
  const resp=await request(BASE+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY},body:JSON.stringify({email,password})});
  const data=await resp.json().catch(()=>({}));
  if(!resp.ok||!data.access_token)throw Error(data.msg||data.error_description||data.message||"認証に失敗しました (HTTP "+resp.status+")");
  accessToken=data.access_token;
  $("password").value="";
  $("signedIn").textContent="ログイン中："+email;
  display(true);
  status("ログイン成功。DriverIDを入力して招待リンクを発行できます。");
 }catch(e){status("ログイン失敗："+(e.name==="AbortError"?"通信が15秒以内に完了しませんでした":e.message));}
 finally{$("login").disabled=false;}
});
$("logout").addEventListener("click",()=>{
 accessToken=null;display(false);$("result").replaceChildren();status("ログアウトしました。");
});
$("issue").addEventListener("click",async()=>{
 $("issue").disabled=true;$("result").replaceChildren();status("招待リンクを発行中…");
 try{
  const driverId=$("driverId").value.trim();
  if(!/^[A-Za-z0-9_-]{2,40}$/.test(driverId))throw Error("DriverIDの形式を確認してください");
  if(!accessToken)throw Error("再ログインしてください");
  const resp=await request(FN,{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY,"Authorization":"Bearer "+accessToken},body:JSON.stringify({action:"issue",driver_id:driverId})});
  const out=await resp.json().catch(()=>({}));
  if(!resp.ok)throw Error(out.error||"発行に失敗しました (HTTP "+resp.status+")");
  if(!/^[A-Za-z0-9_-]{43}$/.test(out.invite_code||""))throw Error("招待コードが不正です");
  const link="https://happysugar-system.github.io/gf-mypage-demo/existing-driver-line-invite-demo.html?invite="+encodeURIComponent(out.invite_code);
  const p=document.createElement("p");p.textContent="招待リンクを発行しました。有効期限24時間・1回限り。";
  const a=document.createElement("a");a.href=link;a.textContent=link;a.referrerPolicy="no-referrer";
  const copy=document.createElement("button");copy.textContent="招待リンクをコピー";
  copy.addEventListener("click",()=>navigator.clipboard.writeText(link).then(()=>status("リンクをコピーしました。本人確認済みの宛先に送ってください。")).catch(()=>status("コピーできません。リンクを手動でコピーしてください。")));
  $("result").append(p,a,document.createElement("br"),copy);
  status("発行成功。リンクはまだ送信していません。");
 }catch(e){status("発行エラー："+(e.name==="AbortError"?"通信が15秒以内に完了しませんでした":e.message));}
 finally{$("issue").disabled=false;}
});
display(false);
status("画面の準備完了。管理者アカウントでログインしてください。（修正版 v3）");
</script></body></html>
