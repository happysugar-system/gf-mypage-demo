<!DOCTYPE html><html lang="ja"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="UTF-8"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17242b;background:#f4f6f6}*{box-sizing:border-box}body{margin:0}header{background:#153c36;color:white;padding:21px 18px;font-weight:700;letter-spacing:.05em}main{max-width:520px;margin:20px auto;padding:0 14px}.card{background:white;border-radius:16px;padding:22px;box-shadow:0 2px 12px #17332b13;margin-bottom:15px}h1{font-size:20px;margin:0 0 10px}h2{font-size:17px;margin:0 0 16px}.muted{color:#6c7b7c;font-size:13px;line-height:1.7}label{display:block;font-weight:600;margin:18px 0 7px}input{width:100%;font-size:16px;padding:13px;border:1px solid #ccd7d4;border-radius:9px}button{background:#166b56;color:white;border:0;border-radius:9px;padding:14px 17px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:14px}button:disabled{opacity:.5}.secondary{background:#e7eeeb;color:#214b42}.status{border-radius:10px;background:#e9f3ee;padding:14px;margin:14px 0;font-weight:700;color:#186b53}.step{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #edf0ef}.dot{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#e9eeed;color:#5b6b67;flex:none}.step.current .dot{background:#166b56;color:white}.step.done .dot{background:#a2cdb6;color:#124c3c}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf0ef}.row span:first-child{color:#667572}.hidden{display:none}#message{margin-top:14px;font-size:14px;color:#aa3d30;white-space:pre-wrap}.notice{font-size:12px;color:#666;border-top:1px solid #eee;padding-top:14px;margin-top:20px}
</style></head><body><header>GOLD FIRST <small>｜マイページ デモ</small></header><main>
<section id="login" class="card"><h1>メール認証でログイン</h1><p class="muted">テスト用メールアドレスに6桁の認証コードを送信します。実際の顧客情報は使用しません。</p><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" placeholder="test@example.com"><button id="send" onclick="sendCode()">認証コードを送信</button><div id="otpArea" class="hidden"><label for="code">メールに届いた6桁のコード</label><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button id="verify" onclick="verifyCode()">認証してマイページへ</button></div><div id="message" role="status"></div></section>
<section id="mypage" class="hidden"><div class="card"><h1>車両のお申込み状況</h1><p class="muted" id="welcome"></p><div class="status" id="status"></div><div id="steps"></div></div><div class="card"><h2>申込情報</h2><div class="row"><span>申込番号</span><strong id="receipt"></strong></div><div class="row" id="vehicleRow" style="display:none"><span>車番</span><strong id="vehicle"></strong></div><div class="row"><span>契約状況</span><strong id="contract"></strong></div><div class="row"><span>名変予定日</span><strong id="nameChange"></strong></div><div class="row"><span>引渡可能日</span><strong id="handover"></strong></div><button class="secondary" onclick="logout()">ログアウト</button></div></section>
<p class="notice">メール認証の動作テスト｜表示データは架空です。既存データ接続・会社担当者画面は未実装です。</p></main>
<iframe id="bridge" title="認証処理" style="position:absolute;width:1px;height:1px;border:0;opacity:0;pointer-events:none" referrerpolicy="no-referrer"></iframe>
<script>
// Replace ONLY the following value with the newly deployed GAS /exec URL.
const GAS_WEB_APP_URL='https://script.google.com/macros/s/AKfycbyUNhCepktwSYjCq1T_rRrPDoFybTRoYR3xJxZXB_EU3VFHNvDWLPVI479zOLML96-Y/exec';
const $=id=>document.getElementById(id);
const APP='GF_MY_PAGE_V03';let ready=false,sequence=0;const pending=new Map();
const gasOriginAllowed=origin=>origin==='https://script.google.com'||/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(origin);
function setMessage(message){$('message').textContent=message}
function call(action,fields={}){
 return new Promise((resolve,reject)=>{
  if(!ready){reject(Error('GASの接続準備ができていません。URLと公開設定を確認してください'));return}
  const id=++sequence;
  const timer=setTimeout(()=>{pending.delete(id);reject(Error('通信がタイムアウトしました'))},25000);
  pending.set(id,{resolve,reject,timer});
  $('bridge').contentWindow.postMessage({app:APP,id,action,...fields},'*');
 });
}
window.addEventListener('message',event=>{
 if(event.source!==$('bridge').contentWindow||!gasOriginAllowed(event.origin))return;
 const m=event.data;if(!m||m.app!==APP)return;
 if(m.type==='ready'){ready=true;setMessage('');return}
 const p=pending.get(m.payload?.id);if(!p)return;
 clearTimeout(p.timer);pending.delete(m.payload.id);
 if(m.type==='error')p.reject(Error(m.payload.message));else p.resolve(m.payload.result);
});
if(GAS_WEB_APP_URL.startsWith('https://script.google.com/macros/s/'))$('bridge').src=GAS_WEB_APP_URL;
else setMessage('設定が必要です：index.html の GAS_WEB_APP_URL にGASの /exec URLを入れてください。');
async function sendCode(){
 const email=$('email').value.trim();$('send').disabled=true;setMessage('認証コードを送信中…');
 try{await call('request',{email});$('otpArea').classList.remove('hidden');setMessage('認証コードをメールに送信しました。メールを確認してください。')}
 catch(e){setMessage(e.message)}finally{$('send').disabled=false}
}
async function verifyCode(){
 $('verify').disabled=true;setMessage('認証中…');
 try{const d=await call('verify',{email:$('email').value.trim(),code:$('code').value.trim()});showPage(d);setMessage('')}
 catch(e){setMessage(e.message)}finally{$('verify').disabled=false}
}
function showPage(d){
 $('login').classList.add('hidden');$('mypage').classList.remove('hidden');
 $('welcome').textContent=d.name+' 様 / '+d.driverId;
 $('status').textContent='現在：'+d.stage;
 ['receipt','contract','nameChange','handover'].forEach(k=>$(k).textContent=d[k]||'未定');
 $('vehicleRow').style.display=d.vehicle?'':'none';$('vehicle').textContent=d.vehicle||'';
 const steps=['申込受付','契約締結','車両準備中','名義変更','引渡可能'],current=steps.indexOf(d.stage);
 $('steps').replaceChildren();steps.forEach((s,i)=>{
  const div=document.createElement('div');div.className='step '+(i<current?'done':i===current?'current':'');
  const dot=document.createElement('span');dot.className='dot';dot.textContent=i<current?'✓':String(i+1);
  const title=document.createElement('span');title.textContent=s;div.append(dot,title);$('steps').append(div);
 });
}
async function logout(){try{await call('logout')}catch(e){}$('mypage').classList.add('hidden');$('login').classList.remove('hidden');$('otpArea').classList.add('hidden');$('code').value='';setMessage('ログアウトしました')}
</script></body></html>
