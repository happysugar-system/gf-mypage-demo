<!doctype html><html lang="ja"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;color:#183c34;background:#f4f7f6;margin:0}main{max-width:760px;margin:auto;padding:20px}section{background:white;border-radius:12px;padding:18px;margin:12px 0}label{display:block;margin:12px 0}textarea,input:not([type=checkbox]){display:block;width:100%;box-sizing:border-box;padding:10px;font:inherit}button{padding:10px 18px;border:0;border-radius:8px;background:#166b56;color:white;font:inherit;margin:4px}button:disabled{opacity:.5}article{border-top:1px solid #ddd;padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><h1>お知らせ管理</h1><p>ドライバーマイページに最新10件を表示します。</p><section><h2 id="heading">新規登録</h2><form id="form"><label>お知らせ内容<textarea id="body" required maxlength="1000" rows="5"></textarea></label><label>掲載開始（端末の現地時刻）<input id="start" type="datetime-local" required></label><label>掲載終了（空欄は期限なし）<input id="end" type="datetime-local"></label><label><input id="enabled" type="checkbox"> 掲載を有効にする</label><button id="save">保存</button><button type="button" id="reset">新規入力</button></form><p id="msg" role="status"></p></section><section><h2>登録済みのお知らせ</h2><button id="reload">再読み込み</button><div id="list"></div></section></main><script>
const $=id=>document.getElementById(id);let id=null;
const local=v=>{const d=new Date(v);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};
function reset(){id=null;$('form').reset();$('start').value=local(Date.now());$('heading').textContent='新規登録';}
function edit(r){id=r.id;$('heading').textContent='編集';$('body').value=r.body;$('start').value=local(r.starts_at);$('end').value=r.ends_at?local(r.ends_at):'';$('enabled').checked=r.enabled;window.scrollTo(0,0);}
function fail(e){$('save').disabled=false;$('msg').textContent=e.message||'通信エラー';}
function load(){google.script.run.withFailureHandler(fail).withSuccessHandler(rows=>{$('list').replaceChildren();for(const r of rows){const a=document.createElement('article'),p=document.createElement('p'),b=document.createElement('button');const now=Date.now();const state=!r.enabled?'非公開':Date.parse(r.starts_at)>now?'掲載待ち':r.ends_at&&Date.parse(r.ends_at)<=now?'掲載終了':'掲載中';p.textContent=state+' | '+new Date(r.starts_at).toLocaleString()+' ～ '+(r.ends_at?new Date(r.ends_at).toLocaleString():'期限なし')+'\n'+r.body;b.textContent='編集';b.onclick=()=>edit(r);a.append(p,b);$('list').append(a);}}).GF_NOTICE_list();}
$('form').onsubmit=e=>{e.preventDefault();$('save').disabled=true;$('msg').textContent='保存中…';google.script.run.withFailureHandler(fail).withSuccessHandler(()=>{$('save').disabled=false;$('msg').textContent='保存しました';reset();load();}).GF_NOTICE_save({id,body:$('body').value,enabled:$('enabled').checked,starts_at:new Date($('start').value).toISOString(),ends_at:$('end').value?new Date($('end').value).toISOString():null});};$('reset').onclick=reset;$('reload').onclick=load;reset();load();
</script></body></html>
