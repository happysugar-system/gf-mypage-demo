<!doctype html><html lang="ja"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;background:#f4f7f6;color:#183c34;margin:0}main{max-width:850px;margin:auto;padding:16px}section{background:white;padding:16px;border-radius:12px;margin:12px 0}button,select{font:inherit;padding:10px;border-radius:8px;border:1px solid #b5ccc4}button{background:#166b56;color:white;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}th{background:#edf4f1}.scroll{overflow:auto}label{display:inline-block;margin:6px}</style></head><body><main><h1>月別納車管理</h1><p>車両台帳・実績履歴から集計します。実績は貸出開始の完了件数（暫定）です。</p><button id="reload">最新情報を取得</button><p id="msg" role="status"></p><section><h2>月別集計</h2><div class="scroll"><table id="summary"></table></div></section><section><h2>納車明細</h2><label>対象月 <select id="month"></select></label><label>区分 <select id="kind"><option value="">すべて</option><option value="予定">予定</option><option value="貸出開始実績（暫定）">実績（暫定）</option></select></label><p id="count"></p><div class="scroll"><table id="details"></table></div></section></main><script>
const $=id=>document.getElementById(id);let data=null,request=0;
function table(el,rows,click){el.replaceChildren();for(const [i,row] of rows.entries()){const tr=document.createElement('tr');for(const [j,v] of row.entries()){const cell=document.createElement(i===0?'th':'td');if(i&&click&&j>0){const b=document.createElement('button');b.textContent=String(v);b.onclick=()=>click(row[0],j);cell.append(b);}else cell.textContent=String(v??'');tr.append(cell);}el.append(tr);}}
function render(){if(!data)return;const month=$('month').value,kind=$('kind').value;const rows=data.details.slice(1).filter(r=>(!month||r[0]===month)&&(!kind||r[1]===kind));table($('details'),[data.details[0],...rows]);$('count').textContent=rows.length+'件';}
function load(){const seq=++request;$('reload').disabled=true;$('msg').textContent='取得中…';google.script.run.withFailureHandler(e=>{if(seq!==request)return;data=null;$('summary').replaceChildren();$('details').replaceChildren();$('count').textContent='';$('msg').textContent=e.message||'取得失敗';$('reload').disabled=false;}).withSuccessHandler(r=>{if(seq!==request)return;data=r;const prev=$('month').value;$('month').replaceChildren(new Option('すべて',''));for(const row of r.summary.slice(1))$('month').append(new Option(row[0],row[0]));if([...$('month').options].some(o=>o.value===prev))$('month').value=prev;table($('summary'),r.summary,(m,j)=>{$('month').value=m;$('kind').value=j===1?'予定':'貸出開始実績（暫定）';render();$('details').scrollIntoView({block:'nearest'});});render();$('msg').textContent='取得完了';$('reload').disabled=false;}).GF_DELIVERY_staffData();}
$('reload').onclick=load;$('month').onchange=render;$('kind').onchange=render;load();
</script></body></html>
